<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Teal gradient for diagonal stroke -->
    <linearGradient id="diagGrad" x1="20" y1="22" x2="100" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1de9b6"/>
      <stop offset="55%"  stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#c8dde8"/>
    </linearGradient>
    <!-- Silver gradient for right bar -->
    <linearGradient id="rightGrad" x1="82" y1="22" x2="100" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#c8dde8"/>
      <stop offset="100%" stop-color="#8ab4c8"/>
    </linearGradient>
    <!-- Dark gradient for left bar -->
    <linearGradient id="leftGrad" x1="20" y1="22" x2="38" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1a3a50"/>
      <stop offset="100%" stop-color="#0f2535"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="tealGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── Left vertical bar (dark charcoal) ── -->
  <path d="M20 22 L38 22 L38 98 L20 98 Z" fill="url(#leftGrad)"/>

  <!-- ── Right vertical bar (silver/white) ── -->
  <path d="M82 22 L100 22 L100 98 L82 98 Z" fill="url(#rightGrad)"/>

  <!-- ── Diagonal connector (teal→cyan) — sits on top ── -->
  <path d="M38 22 L82 22 L82 38 L38 82 Z" fill="url(#diagGrad)" filter="url(#tealGlow)"/>

  <!-- ── Corner bevel cuts for 3-D feel ── -->
  <!-- Top-left inner bevel -->
  <path d="M20 22 L38 22 L38 28 L26 28 Z" fill="rgba(0,0,0,0.25)"/>
  <!-- Bottom-right inner bevel -->
  <path d="M82 92 L100 98 L82 98 Z" fill="rgba(0,0,0,0.2)"/>

  <!-- ── Edge highlight on diagonal ── -->
  <path d="M38 22 L82 22" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M82 22 L82 38" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-linecap="round"/>

  <!-- ── Circuit nodes ── -->
  <!-- Top-left node -->
  <line x1="20" y1="22" x2="20" y2="10" stroke="#1de9b6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="10" x2="10" y2="10" stroke="#1de9b6" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="10" cy="10" r="3.5" fill="#1de9b6" filter="url(#nodeGlow)"/>
  <circle cx="20" cy="22" r="3" fill="#1de9b6" opacity="0.7" filter="url(#nodeGlow)"/>

  <!-- Right-top node -->
  <line x1="100" y1="22" x2="112" y2="22" stroke="#c8dde8" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="112" cy="22" r="2.5" fill="#c8dde8" opacity="0.8"/>

  <!-- Bottom-right node -->
  <line x1="100" y1="98" x2="100" y2="110" stroke="#8ab4c8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="100" y1="110" x2="112" y2="110" stroke="#8ab4c8" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="112" cy="110" r="3" fill="#8ab4c8" opacity="0.7"/>

  <!-- Bottom-left small platform step -->
  <rect x="10" y="92" width="10" height="6" rx="1" fill="#1a3a50" opacity="0.8"/>
  <line x1="20" y1="95" x2="10" y2="95" stroke="#1de9b6" stroke-width="1" opacity="0.5"/>

  <!-- Mid diagonal dot -->
  <circle cx="60" cy="52" r="2" fill="rgba(29,233,182,0.6)"/>
</svg>
