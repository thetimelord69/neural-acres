<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Neural Acres mark</title>
  <desc id="desc">Angular N and A monogram with biotech circuit nodes.</desc>
  <defs>
    <linearGradient id="teal" x1="16" y1="16" x2="82" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1DE9B6"/>
