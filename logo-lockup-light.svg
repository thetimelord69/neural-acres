    <path d="M45.7 65L118 111V136L45.7 91V65Z" fill="white" fill-opacity=".88"/>
    <path d="M46 52L22 66V78L46 65L118 111V98L46 52Z" fill="#08131F" fill-opacity=".72"/>
    <path d="M47 115L75 100L91 111L64 126L47 115Z" fill="#0FAF9F" fill-opacity=".88"/>
    <path d="M84 60V40" stroke="#C8DDE8" stroke-width="3.6" stroke-linecap="round"/>
