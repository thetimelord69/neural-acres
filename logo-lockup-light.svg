<svg width="560" height="160" viewBox="0 0 560 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Neural Acres</title>
  <desc id="desc">Neural Acres horizontal logo lockup for dark backgrounds.</desc>
  <defs>
    <linearGradient id="markTeal" x1="20" y1="28" x2="116" y2="124" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1DE9B6"/>
      <stop offset=".58" stop-color="#86F5E3"/>
      <stop offset="1" stop-color="#C8DDE8"/>
    </linearGradient>
    <linearGradient id="markCyan" x1="32" y1="112" x2="116" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B7E78"/>
      <stop offset=".55" stop-color="#1DE9B6"/>
      <stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="markSilver" x1="104" y1="28" x2="128" y2="124" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#8AB4C8"/>
    </linearGradient>
    <linearGradient id="wordSilver" x1="164" y1="44" x2="498" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".68" stop-color="#EAF4FA"/>
      <stop offset="1" stop-color="#9BBFD0"/>
    </linearGradient>
    <filter id="nodeGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

