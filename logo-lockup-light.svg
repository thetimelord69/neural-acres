    <text x="165" y="113" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="13">ACRES</text>
  </g>
  <circle cx="491" cy="84" r="5.5" stroke="#EAF4FA" stroke-width="1.6"/>
